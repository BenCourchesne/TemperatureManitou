<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Activité solunaire — Lac Manitou</title>
<link rel="icon" href="favico.png">
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<style>
  :root{
    --bg:#07111e; --bg2:#0c1a2e; --panel:rgba(255,255,255,.045);
    --panel2:rgba(255,255,255,.025); --hover:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.14);
    --text:#e2eaf4; --muted:#6b82a0; --dim:#3a4a5f;
    --fish:#2dd4bf; --deer:#e0913f; --moon:#cbd5e1;
    --live:#34d399; --warn:#fbbf24; --radius:16px;
    --accent:var(--fish);
    font-synthesis:none;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 8%, rgba(14,80,130,.28) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 85%, rgba(56,189,248,.10) 0%, transparent 55%);
  }
  .wrap{position:relative; z-index:1; max-width:940px; margin:0 auto; padding:1.4rem 1.15rem 3rem}

  .app{
    background:linear-gradient(180deg, rgba(12,26,46,.6), rgba(7,17,30,.4));
    border:1px solid var(--border); border-radius:22px; padding:1.2rem;
    box-shadow:0 24px 60px rgba(0,0,0,.4);
  }
  .app-head{display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1rem}
  .app-title{display:flex; align-items:center; gap:.55rem; font-weight:650}
  .app-title .ic{width:26px; height:26px; color:var(--accent); transition:color .3s; flex-shrink:0}
  .app-title small{display:block; font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .back-lmt{display:inline-flex; align-items:center; gap:.1rem; color:var(--muted); text-decoration:none; font-size:.8rem; font-weight:600;
    padding:.35rem .55rem .35rem .35rem; border-radius:8px; border:1px solid var(--border); margin-right:.2rem; transition:.15s; min-height:36px}
  .back-lmt:hover{color:var(--text); background:var(--hover); border-color:var(--border2)}
  .back-lmt svg{width:16px; height:16px}

  .head-tools{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
  .icon-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--muted);
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:.15s; font-family:inherit; font-size:.78rem; font-weight:700}
  .icon-btn:hover{color:var(--text); background:var(--hover); border-color:var(--border2)}
  .icon-btn svg{width:18px; height:18px}

  .seg{display:inline-flex; background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden}
  .seg button{
    cursor:pointer; font-family:inherit; border:0; background:transparent; color:var(--muted);
    font-weight:600; font-size:.8rem; padding:.5rem .95rem; transition:.15s; min-height:40px;
  }
  .seg button.on{background:var(--accent); color:#07131f}

  /* ── Facteurs ── */
  .factors{margin-top:.9rem; border:1px solid var(--border); border-radius:12px; background:var(--panel); padding:.75rem .85rem}
  .fx-head{display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:.5rem}
  .fx-src{color:var(--accent); letter-spacing:.03em; transition:color .3s; text-align:right}
  .fx-row{display:flex; align-items:center; gap:.6rem; padding:.32rem 0}
  .fx-lead{display:flex; align-items:center; gap:.42rem; min-width:96px; font-size:.82rem}
  .fx-lead b{font-weight:600}
  .fx-lead svg{width:14px; height:14px; color:var(--muted); flex-shrink:0}
  .fx-read{flex:1; font-size:.78rem; color:var(--muted); min-width:0}
  .fx-note{font-size:.72rem; color:var(--dim); margin:.35rem 0 .1rem; font-style:italic}
  .fx-total{display:flex; align-items:center; gap:.7rem; margin-top:.55rem; padding-top:.6rem; border-top:1px solid var(--border)}
  .ft-lab{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .fx-verdict{font-size:.85rem; font-weight:650; color:var(--accent); margin-left:auto; text-align:right}

  /* ── Grille mois ── */
  .cal-legend{display:flex; gap:1rem; flex-wrap:wrap; font-size:.72rem; color:var(--muted); margin-bottom:.7rem; align-items:center}
  .cal-legend b{color:var(--text); font-weight:600}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px}
  .dow span{text-align:center; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .cell{
    position:relative; aspect-ratio:1/1.08; border:1px solid var(--border); border-radius:11px;
    background:var(--panel2); cursor:pointer; padding:.4rem .35rem; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; transition:.15s; overflow:hidden; font:inherit; color:inherit;
  }
  .cell:hover{border-color:var(--border2); background:var(--hover); transform:translateY(-1px)}
  .cell.blank{opacity:.2; cursor:default; background:transparent; border-color:transparent}
  .cell.today{border-color:var(--accent)}
  .cell.sel{border-color:var(--accent); background:rgba(45,212,191,.10)}
  .cell.nohorizon::after{content:''; position:absolute; bottom:4px; right:5px; width:4px; height:4px; border-radius:50%; background:var(--dim)}
  .cell .dnum{font-size:.82rem; font-weight:650; align-self:flex-start; font-variant-numeric:tabular-nums}
  .cell .glow{position:absolute; inset:0; opacity:calc(var(--sc,0)/4*.22); background:radial-gradient(circle at 50% 120%, var(--accent), transparent 70%); pointer-events:none}
  .cell .mn{position:absolute; top:.34rem; right:.34rem; width:12px; height:12px; color:var(--moon); opacity:.65}

  /* ── Vue semaine ── */
  .wk{display:flex; flex-direction:column; gap:8px}
  .wk-row{display:grid; grid-template-columns:auto auto 1fr; gap:.8rem; align-items:center; text-align:left; font:inherit; color:inherit;
    border:1px solid var(--border); border-radius:12px; background:var(--panel2); padding:.6rem .8rem; cursor:pointer; transition:.15s; width:100%}
  .wk-row:hover{border-color:var(--border2); background:var(--hover)}
  .wk-row.sel{border-color:var(--accent)}
  .wk-day{min-width:74px}
  .wk-day b{display:block; font-size:.9rem; font-weight:650; text-transform:capitalize}
  .wk-day span{font-size:.7rem; color:var(--muted)}

  /* ── Barre 24 h ── */
  .tl{display:block; position:relative; height:38px; border-radius:9px; background:linear-gradient(90deg,#0a1524,#0d1c30); border:1px solid var(--border); overflow:hidden}
  .tl.slim{height:26px}
  .tl-scale{display:flex; justify-content:space-between; font-size:.6rem; color:var(--dim); margin-top:3px; font-variant-numeric:tabular-nums}

  /* ── Détail ── */
  .detail{margin-top:1rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel2); padding:1rem 1.1rem}
  .detail-head{display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap; margin-bottom:.8rem}
  /* pas de `capitalize` : en français seule la 1re lettre se majuscule (« 22 juillet »),
     la capitale est posée en JS via capFirst() */
  .detail-head .dh-date{font-size:1.05rem; font-weight:650}
  .detail-head .dh-phase{font-size:.76rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; margin-top:.1rem}
  .detail-head .dh-phase svg{width:14px; height:14px; color:var(--moon)}
  .day-step{display:flex; align-items:center; gap:.4rem}
  .day-step button{width:44px; height:44px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; font-family:inherit; padding:0}
  .day-step button:hover{color:var(--text); background:var(--hover); border-color:var(--border2)}
  .day-step button svg{width:18px; height:18px}
  .day-step .today-reset{width:auto; gap:.35rem; padding:0 .75rem; font-size:.76rem; font-weight:600}
  .day-step .today-reset svg{width:15px; height:15px}
  .astro{display:flex; gap:1.2rem; flex-wrap:wrap; font-size:.78rem; color:var(--muted); margin-top:.7rem}
  .astro span{display:flex; align-items:center; gap:.35rem}
  .astro svg{width:14px; height:14px}
  .tip{margin-top:.9rem; border-left:2px solid var(--accent); background:rgba(45,212,191,.05); padding:.6rem .8rem; border-radius:0 8px 8px 0; font-size:.82rem}
  .tip b{color:var(--text)}

  .foot{font-size:.7rem; color:var(--dim); text-align:center; margin-top:1.4rem; line-height:1.6}

  @media (max-width:560px){
    .wrap{padding:1rem .7rem 2.5rem}
    .app{padding:.9rem}
    /* Cases calendrier serrées à 7 colonnes → indice compact */
    .cell{aspect-ratio:1/1.15; padding:.3rem .3rem}
    .cell .dnum{font-size:.72rem}
    .cell-idx{font-size:.95rem}
    .cell-win{font-size:.52rem}
    .fx-lead{min-width:82px}
    /* la lecture contextuelle passe sous la contribution en colonne étroite */
    .fx-row{flex-wrap:wrap}
    .fx-read{flex-basis:100%; order:5; padding-left:.3rem}
    /* §6 : cibles tactiles ≥ 44 px */
    .seg button{min-height:44px}
    .icon-btn{width:44px; height:44px}
    .back-lmt{min-height:44px}
    .head-tools{width:100%}
    .seg-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
    /* Semaine : jour + indice sur une ligne, barre 24 h en dessous */
    .wk-row{grid-template-columns:auto 1fr; gap:.45rem .6rem}
    .wk-row .wkt{grid-column:1 / -1}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

  /* ══ v2 — indice horaire par régime (§15, Phase 2) ══ */
  /* Courbe 24 h */
  .tl-curve{position:absolute; inset:0; width:100%; height:100%; display:block}
  .tl-empty{display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.72rem}
  /* Cases du mois : indice 0-100 + heure de la meilleure fenêtre */
  .cell-idx{font-size:1.15rem; font-weight:700; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums}
  .cell-idx.na{color:var(--dim); font-weight:600}
  .cell-win{font-size:.58rem; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:1px}
  /* Vue semaine : indice */
  .wk-idx{font-size:1.15rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; min-width:34px; text-align:center}
  /* Décomposition : contribution signée par facteur, pastille de régime */
  .fx-pts{font-weight:700; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; font-size:.82rem}
  .fx-pts.pos{color:var(--live)} .fx-pts.neg{color:#f87171} .fx-pts.zero{color:var(--dim)}
  .fx-reg{display:inline-block; width:12px; height:12px; border-radius:3px; flex-shrink:0}
  .fx-big{font-size:1.5rem; font-weight:750; color:var(--accent); font-variant-numeric:tabular-nums; margin-left:.1rem}
  /* Bandeau « Prochaines fenêtres » */
  .banner{border:1px solid var(--border); border-radius:14px; background:var(--panel); padding:.7rem .8rem; margin-bottom:1rem}
  .banner-h{font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:.55rem}
  .banner-empty{font-size:.8rem; color:var(--dim); font-style:italic}
  .bw-row{display:grid; grid-template-columns:auto auto 1fr auto; gap:.75rem; align-items:center; width:100%; text-align:left;
    font:inherit; color:inherit; cursor:pointer; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:.5rem .7rem; margin-bottom:6px; transition:.15s; min-height:44px}
  .bw-row:last-child{margin-bottom:0}
  .bw-row:hover{border-color:var(--border2); background:var(--hover); transform:translateY(-1px)}
  .bw-idx{font-size:1.2rem; font-weight:750; color:var(--accent); font-variant-numeric:tabular-nums; min-width:30px; text-align:center}
  .bw-when b{display:block; font-size:.82rem; font-weight:650; text-transform:capitalize}
  .bw-when span{font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .bw-reg{font-size:.74rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; min-width:0}
  .bw-reg i{width:9px; height:9px; border-radius:50%; flex-shrink:0}
  .bw-fiab{font-size:.62rem; letter-spacing:.04em; text-transform:uppercase; font-weight:700; color:var(--muted); white-space:nowrap}
  .bw-fiab.bonne{color:var(--live)} .bw-fiab.correcte{color:var(--warn)}
  .bw-fiab.indicative,.bw-fiab.lune{color:var(--dim)}
  @media (max-width:560px){
    .bw-row{display:flex; flex-wrap:wrap; align-items:center; gap:.2rem .6rem}
    .bw-idx{min-width:auto} .bw-when{flex:1}
    .bw-fiab{margin-left:auto} .bw-reg{flex-basis:100%; order:5}
  }
</style>
</head>

</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   0. Constantes partagées avec index.html
   ══════════════════════════════════════════════════════════════════════════ */
const TZ   = 'America/Toronto';
const LAKE = { lat: 46.0471, lon: -74.3739 };
const RTDB = 'https://lac-manitou-temperatures-d284a-default-rtdb.firebaseio.com';
const OPEN_METEO = 'https://api.open-meteo.com/v1/forecast';
const DAY_MS = 864e5;

// JSON pour les objets propres à cette page. ⚠ `lm_lang` et les autres
// préférences partagées avec index.html sont stockées en CHAÎNE BRUTE là-bas
// (LS.get/set y font un simple getItem/setItem) — les écrire en JSON y
// injecterait des guillemets et casserait la bascule de langue. D'où rawGet/rawSet.
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
  rawGet(k, d){ try { return localStorage.getItem(k) || d; } catch(e){ return d; } },
  rawSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

/* Le §1 (const SCORING, poids v1) a été retiré : le modèle v2 le remplace par
   `MODEL` (bloc 10b, spec §15.10). Cf. §19-7 « retirer SCORING ». */

/* ══════════════════════════════════════════════════════════════════════════
   2. Dates civiles en America/Toronto (spec §9)
      Un « jour » = {y, m, d} (m 1-12). L'arithmétique se fait en UTC sur
      l'étiquette civile → insensible au DST ; les bornes réelles passent par
      zonedMidnight(), qui interroge Intl et gère les jours de 23 h / 25 h.
   ══════════════════════════════════════════════════════════════════════════ */
const _dtfParts = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ, hour12: false, year:'numeric', month:'2-digit', day:'2-digit',
  hour:'2-digit', minute:'2-digit', second:'2-digit'
});
function tzOffsetMs(utcMs){
  const p = {};
  for (const x of _dtfParts.formatToParts(new Date(utcMs))) p[x.type] = x.value;
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  return asUTC - utcMs;
}
function civOf(utcMs){
  const p = {};
  for (const x of _dtfParts.formatToParts(new Date(utcMs))) p[x.type] = x.value;
  return { y:+p.year, m:+p.month, d:+p.day };
}
/** Instant UTC de minuit local (Toronto) pour un jour civil. Double passe = DST-safe. */
function zonedMidnight(c){
  const naive = Date.UTC(c.y, c.m - 1, c.d);
  let ts = naive - tzOffsetMs(naive);
  ts = naive - tzOffsetMs(ts);
  return ts;
}
const civKey  = c => c.y + '-' + String(c.m).padStart(2,'0') + '-' + String(c.d).padStart(2,'0');
const civFromKey = k => { const a = k.split('-').map(Number); return { y:a[0], m:a[1], d:a[2] }; };
function civAdd(c, n){ const d = new Date(Date.UTC(c.y, c.m - 1, c.d) + n * DAY_MS);
  return { y:d.getUTCFullYear(), m:d.getUTCMonth() + 1, d:d.getUTCDate() }; }
const civDow  = c => new Date(Date.UTC(c.y, c.m - 1, c.d)).getUTCDay();
const civEq   = (a,b) => a.y === b.y && a.m === b.m && a.d === b.d;
const civDiff = (a,b) => Math.round((Date.UTC(a.y,a.m-1,a.d) - Date.UTC(b.y,b.m-1,b.d)) / DAY_MS);
const civToday = () => civOf(Date.now());
/** Bornes réelles du jour civil : [début, fin[ en ms UTC. Longueur ≠ 24 h les jours de DST. */
function civSpan(c){ const s = zonedMidnight(c); return { start: s, end: zonedMidnight(civAdd(c, 1)) }; }
/** Clé du bucket /daily (jour UTC de même étiquette) — décalage assumé, spec §9. */
const dailyKeyOf = c => Date.UTC(c.y, c.m - 1, c.d);

/* ══════════════════════════════════════════════════════════════════════════
   3. i18n (spec §8) — la langue est partagée avec index.html (`lm_lang`)
   ══════════════════════════════════════════════════════════════════════════ */
let lang = LS.rawGet('lm_lang', 'fr');
if (lang !== 'fr' && lang !== 'en') lang = 'fr';

const I18N = {
  fr: {

            'Pleine lune','Gibbeuse décroissante','Dernier quartier','Dernier croissant'],

    footNote:'Indice indicatif — modèle de régime météo v2 (§15). Le régime vient d\'Open-Meteo, pas du capteur du lac (§16.3).',
    loading:'Chargement des données…',
    v2:{
      lake:'Lac', lakes:{ manitou:'Manitou', devenyns:'Devenyns' },
      index:'Indice', bestWindow:'meilleure fenêtre', noData:'sans données météo',
      upcoming:'Prochaines fenêtres', noWindow:'Aucune fenêtre au-dessus du seuil sur l\'horizon.',
      verdicts:['Journée creuse','Activité modérée','Bonne journée','Très bonne journée','Journée exceptionnelle'],
      regimes:{ X:'passage du front', F:'postfrontal froid', A:'front en approche', P:'préfrontal', R:'retour à la stabilité', S:'stable', '?':'indéterminé' },
      factors:{ regime:'Régime', pression:'Pression', direction:'Direction', vitesse:'Vent', lune:'Lune', heure:'Heure' },
      fiab:{ bonne:'fiable', correcte:'assez fiable', indicative:'indicative', lune:'lune seule' },

      tip:'<b>Pêche.</b> L\'indice combine régime météo, pression, vent, lune et heure. Vise les fenêtres au-dessus de 70 ; le régime en tête dit <i>pourquoi</i> — de quoi juger le modèle plutôt que le suivre aveuglément.'
    }
  },
  en: {
    title:'Solunar activity', subFish:'Fishing mode',
    back:'lmt', backTitle:'Back to dashboard',
    day:'Day', week:'Week', month:'Month', total:'Total',
    today:'Today', prevDay:'Previous day', nextDay:'Next day',
    sunrise:'Sunrise', sunset:'Sunset', moonrise:'Moon',
    weekOf:'Week of', lit:'% lit',
    phases:['New moon','Waxing crescent','First quarter','Waxing gibbous',
            'Full moon','Waning gibbous','Last quarter','Waning crescent'],
    sectors:{ N:'N', NE:'NE', E:'E', SE:'SE', S:'S', SO:'SW', O:'W', NO:'NW' },
    footNote:'Indicative index — v2 weather-regime model (§15). The regime comes from Open-Meteo, not the lake sensor (§16.3).',
    loading:'Loading data…',
    v2:{
      lake:'Lake', lakes:{ manitou:'Manitou', devenyns:'Devenyns' },
      index:'Index', bestWindow:'best window', noData:'no weather data',
      upcoming:'Upcoming windows', noWindow:'No window above threshold over the horizon.',
      verdicts:['Slow day','Moderate','Good day','Very good day','Exceptional'],
      regimes:{ X:'front passage', F:'cold postfrontal', A:'front approaching', P:'prefrontal', R:'returning to stable', S:'stable', '?':'undetermined' },
      factors:{ regime:'Regime', pression:'Pressure', direction:'Direction', vitesse:'Wind', lune:'Moon', heure:'Time' },
      fiab:{ bonne:'reliable', correcte:'fairly reliable', indicative:'indicative', lune:'moon only' },
      reduced:'halved — same front as the regime (§15.8)',
      atWindow:'at the best window', factorsTitle:'Index breakdown',

    }

};

/* ══════════════════════════════════════════════════════════════════════════
   5. Astronomie — SunCalc, bornes du jour civil Toronto
   ══════════════════════════════════════════════════════════════════════════ */
function moonPhaseSVG(phase){
  const R = 7, C = 9, k = Math.cos(phase * 2 * Math.PI), rx = Math.abs(R * k);
  const os = phase < 0.5 ? 1 : 0, is = k >= 0 ? os : 1 - os;
  const d = `M${C},${C-R} A${R},${R} 0 0,${os} ${C},${C+R} A${rx},${R} 0 0,${is} ${C},${C-R} Z`;
  return `<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/><path d="${d}" fill="currentColor"/></svg>`;
}
/** Index de phase — mêmes fenêtres étroites que updateMoon() dans index.html. */
function phaseIndex(p){
  const TH = 0.02;
  if (p < TH || p > 1 - TH) return 0;
  if (Math.abs(p - .25) < TH) return 2;
  if (Math.abs(p - .5)  < TH) return 4;
  if (Math.abs(p - .75) < TH) return 6;
  if (p < .25) return 1;
  if (p < .5)  return 3;
  if (p < .75) return 5;
  return 7;
}

/* `solunar()` (v1, câblé sur LAKE Manitou, majeures/mineures solunaires) est
   retiré : le v2 dérive tout l'astronomie du jour aux coordonnées du lac via
   `V2.astro()`, et la barre 24 h porte la courbe d'indice, pas les fenêtres
   solunaires (§Phase 2). `moonPhaseSVG` et `phaseIndex` ci-dessus restent
   utilisés par la vue Jour et la grille. */

/* La couche de données v1 (§6 : /readings capteur, /daily, agrégation
   Open-Meteo par jour civil, `dayWeather`) a été retirée. Le v2 note sur
   Open-Meteo seul aux coordonnées du lac (§16.3) via `V2.load`, et le capteur
   Manitou ne sert plus au régime ni au score (§18.5, §16.3). */

/* ══════════════════════════════════════════════════════════════════════════
   7. Glu interface ↔ moteur v2 (§15, §16) — remplace le modèle de cote v1
      L'indice, les régimes, les facteurs et les fenêtres viennent tous de `V2`
      (bloc 10b). Ici : l'état de l'interface et quelques libellés localisés.
   ══════════════════════════════════════════════════════════════════════════ */
// `lake` n'est PAS validé contre LAKES ici : LAKES est déclaré plus bas (bloc
// 10b) et serait dans sa zone morte temporelle. La validation se fait au
// démarrage (§11), une fois tout le module évalué.
const STATE = {
  gran: 'month',
  sel: civToday(),
  lake: LS.rawGet('lm_cp_lake', 'manitou')
};
const lakeKey = () => STATE.lake;
/** Série chargée pour le lac courant ? (sinon on affiche le voile de chargement) */
const lakeReady = () => !!V2.series[STATE.lake];

/** Verdict d'un indice 0-100 → index 0-4 dans T().v2.verdicts. */
const VERDICT_BANDS = [40, 55, 70, 85];               // <40 · 40-55 · 55-70 · 70-85 · ≥85
const verdictIdx = n => { let i = 0; while (i < VERDICT_BANDS.length && n >= VERDICT_BANDS[i]) i++; return i; };
const verdictV2  = n => T().v2.verdicts[verdictIdx(n)];
/** Classe de teinte 0-4 (réutilise --sc des cases pour la lueur). */
const heatLevel  = n => Math.max(0, Math.min(4, Math.round(n / 25)));

const regimeNom = code => T().v2.regimes[code] || (MODEL.regimes[code] && MODEL.regimes[code].nom) || code;
const factorNom = key  => T().v2.factors[key] || key;
const fiabNom   = f    => T().v2.fiab[f] || f;

/** Indices horaires (0-100) d'un jour civil, pour la courbe 24 h. */
function dayCurve(dateISO){
  return V2.dayHours(STATE.lake, dateISO).map(i => ({ i, t: V2.tsAt(V2.series[STATE.lake], i), v: V2.indexAt(STATE.lake, i) }));
}

/* ══════════════════════════════════════════════════════════════════════════
   8. Formatage
   ══════════════════════════════════════════════════════════════════════════ */
const fmtTime = ms => ms == null ? '—' :
  new Date(ms).toLocaleTimeString(locale(), { timeZone:TZ, hour:'2-digit', minute:'2-digit', hour12:false });
function fmtLongDate(c){
  const d = new Date(zonedMidnight(c) + 12 * 3600e3);
  return d.toLocaleDateString(locale(), { timeZone:TZ, weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function fmtMonth(c){
  const d = new Date(zonedMidnight(c) + 12 * 3600e3);
  return d.toLocaleDateString(locale(), { timeZone:TZ, month:'long', year:'numeric' });
}
function fmtShortDate(c){
  const d = new Date(zonedMidnight(c) + 12 * 3600e3);
  return d.toLocaleDateString(locale(), { timeZone:TZ, day:'numeric', month:'short' });
}
function fmtWeekday(c, style){
  const d = new Date(zonedMidnight(c) + 12 * 3600e3);
  return d.toLocaleDateString(locale(), { timeZone:TZ, weekday:style });
}
const dowLabels = () => { const base = civFromKey('2026-01-04'); // un dimanche
  return Array.from({length:7}, (_,i) => fmtWeekday(civAdd(base, i), 'short').replace('.', '').toUpperCase()); };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const capFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

// Teinte par régime — utilisée dans la décomposition et le bandeau.
const REGIME_COLOR = { X:'#fbbf24', F:'#60a5fa', A:'#2dd4bf', P:'#34d399', R:'#94a3b8', S:'#94a3b8', '?':'#64748b' };

/** Une ligne de facteur : libellé, contribution signée en points, lecture. */
function fxRow(icon, name, points, read){
  const cls = points > 0.5 ? 'pos' : points < -0.5 ? 'neg' : 'zero';
  const val = (points > 0 ? '+' : points < 0 ? '−' : '') + Math.abs(Math.round(points));
  return `<div class="fx-row"><span class="fx-lead">${icon}<b>${name}</b></span>` +
    `<span class="fx-pts ${cls}">${val}</span><span class="fx-read">${read}</span></div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   9. Rendu
   ══════════════════════════════════════════════════════════════════════════ */
/**
 * Barre 24 h = courbe de l'indice horaire du jour (§Phase 2), avec nuit ombrée,
 * seuil 70 en pointillé et repère « maintenant ». SVG en viewBox 0-100 étiré à
 * la largeur du conteneur — trait à épaisseur constante via non-scaling-stroke.
 */
function curveHTML(dateISO, slim){
  const pts = dayCurve(dateISO);
  const scale = slim ? '' : `<span class="tl-scale"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>24 h</span></span>`;
  if (!pts.length) return `<span class="tl ${slim ? 'slim' : ''} tl-empty">${T().v2.noData}</span>` + scale;
  const a = V2.astro(STATE.lake, dateISO), span = civSpan(civFromKey(dateISO));
  const at = ms => Math.max(0, Math.min(100, (ms - span.start) / (span.end - span.start) * 100));
  const xy = pts.map(p => [at(p.t), 100 - p.v]);
  const line = xy.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${xy[xy.length-1][0].toFixed(1)} 100 L${xy[0][0].toFixed(1)} 100 Z`;
  let night = '';
  if (a.sunrise) night += `<rect x="0" y="0" width="${at(a.sunrise).toFixed(1)}" height="100" fill="rgba(0,0,0,.30)"/>`;
  if (a.sunset)  night += `<rect x="${at(a.sunset).toFixed(1)}" y="0" width="${(100 - at(a.sunset)).toFixed(1)}" height="100" fill="rgba(0,0,0,.30)"/>`;
  const now = Date.now();
  const nowLine = (now >= span.start && now < span.end)
    ? `<line x1="${at(now).toFixed(1)}" y1="0" x2="${at(now).toFixed(1)}" y2="100" stroke="var(--live)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>` : '';
  const svg = `<svg class="tl-curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${night}` +
    `<line x1="0" y1="30" x2="100" y2="30" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` +
    `<path d="${area}" fill="color-mix(in srgb,var(--accent) 15%,transparent)"/>` +
    `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${nowLine}</svg>`;
  return `<span class="tl ${slim ? 'slim' : ''}">${svg}</span>` + scale;
}

/**
 * Décomposition de l'indice à la meilleure fenêtre du jour (§Phase 2) : régime
 * en tête, puis pression, direction, vitesse, lune, heure — chacun avec sa
 * contribution signée. La réduction anti-double-comptage (§15.8) est mentionnée
 * sur les lignes concernées quand elle s'applique.
 */
function factorsHTML(c){
  const t = T(), dateISO = civKey(c);
  const di = V2.dayIndex(STATE.lake, dateISO);
  if (!di) return `<div class="factors"><div class="fx-head"><span>${t.v2.factorsTitle}</span></div><div class="fx-note">${t.v2.noData}</div></div>`;

  const dec = V2.decompose(STATE.lake, di.i), p = dec.parts;
  const h = V2.series[STATE.lake], W = h.wind_speed_10m[di.i], D = h.wind_direction_10m[di.i];
  const bucket = V2.heureBucket(STATE.lake, h, di.i);
  const redNote = dec.red < 1 ? t.v2.reduced : '';
  const regDot = `<span class="fx-reg" style="background:${REGIME_COLOR[dec.regime] || 'var(--muted)'}"></span>`;
  const kmh = W != null ? ' · ' + Math.round(W) + ' km/h' : '';
  const sect = D != null ? ' · ' + (t.sectors[secteurDe(D)] || '') : '';

  let html = fxRow(regDot,       t.v2.factors.regime,    p.regime,    esc(regimeNom(dec.regime)));
  html += fxRow(ICON.gauge,      t.v2.factors.pression,  p.pression,  p.pression !== 0 && dec.red < 1 ? redNote : '');
  html += fxRow(ICON.compass,    t.v2.factors.direction, p.direction, esc((t.sectors[D != null ? secteurDe(D) : ''] || '')) + (p.direction !== 0 && dec.red < 1 ? ' · ' + redNote : ''));
  html += fxRow(ICON.wind,       t.v2.factors.vitesse,   p.vitesse,   esc((W != null ? Math.round(W) + ' km/h' : '')));
  html += fxRow(ICON.moon,       t.v2.factors.lune,      p.lune,      '');
  html += fxRow(ICON.clock,      t.v2.factors.heure,     p.heure,     esc(t.v2.hour[bucket] || ''));

  const winLbl = fmtTime(di.debut) + '–' + fmtTime(di.fin);
  return `<div class="factors">
    <div class="fx-head"><span>${t.v2.factorsTitle}</span><span class="fx-src">${t.v2.atWindow} ${winLbl}</span></div>
    ${html}
    <div class="fx-total"><span class="ft-lab">${t.total}</span><span class="fx-big" style="--sc:${heatLevel(di.indice)}">${di.indice}</span><span class="fx-verdict">${esc(verdictV2(di.indice))}</span></div>
  </div>`;
}

function detailHTML(c){
  const t = T(), dateISO = civKey(c);
  const isToday = civEq(c, civToday());
  const a = V2.astro(STATE.lake, dateISO);
  const litPct = Math.round(a.fraction * 100);

  return `<div class="detail">
    <div class="detail-head">
      <div>
        <div class="dh-date">${esc(capFirst(fmtLongDate(c)))}</div>
        <div class="dh-phase">${moonPhaseSVG(a.phase)} ${esc(t.phases[phaseIndex(a.phase)])} · ${litPct}${t.lit}</div>
      </div>
      <div class="day-step">
        ${isToday ? '' : `<button class="today-reset" data-step="today">${ICON.clock} ${t.today}</button>`}
        <button data-step="-1" aria-label="${t.prevDay}">${ICON.chevL}</button>
        <button data-step="1" aria-label="${t.nextDay}">${ICON.chevR}</button>
      </div>
    </div>
    ${curveHTML(dateISO)}
    ${factorsHTML(c)}
    <div class="astro">
      <span style="color:var(--warn)">${ICON.sunrise} ${t.sunrise} ${fmtTime(a.sunrise)}</span>
      <span style="color:#fb923c">${ICON.sunset} ${t.sunset} ${fmtTime(a.sunset)}</span>
      <span style="color:var(--moon)">${ICON.moon} ${t.moonrise} ${fmtTime(a.moonrise)} / ${fmtTime(a.moonset)}</span>
    </div>
    <div class="tip">${t.v2.tip}</div>
  </div>`;
}

/** Bandeau « Prochaines fenêtres » (§15.9b) en tête de la vue Mois. */
function bannerHTML(){
  const t = T(), w = V2.meilleuresFenetres(STATE.lake);
  if (!w.length) return `<div class="banner"><div class="banner-h">${t.v2.upcoming}</div><div class="banner-empty">${t.v2.noWindow}</div></div>`;
  const rows = w.map(f => {
    const c = civOf(f.debut);
    const jour = esc(fmtWeekday(c, 'short').replace('.', '') + ' ' + fmtShortDate(c));
    return `<button type="button" class="bw-row" data-key="${civKey(c)}">
      <span class="bw-idx" style="--sc:${heatLevel(f.indice)}">${f.indice}</span>
      <span class="bw-when"><b>${jour}</b><span>${fmtTime(f.debut)}–${fmtTime(f.fin)}</span></span>
      <span class="bw-reg"><i style="background:${REGIME_COLOR[f.regime] || 'var(--muted)'}"></i>${esc(regimeNom(f.regime))} · ${esc(factorNom(f.facteur))}</span>
      <span class="bw-fiab ${f.fiabilite}">${esc(fiabNom(f.fiabilite))}</span>
    </button>`;
  }).join('');
  return `<div class="banner"><div class="banner-h">${t.v2.upcoming}</div>${rows}</div>`;
}

function monthHTML(){
  const t = T(), sel = STATE.sel, today = civToday();
  const first = { y:sel.y, m:sel.m, d:1 };
  const lead = civDow(first);
  const dim = new Date(Date.UTC(sel.y, sel.m, 0)).getUTCDate();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cell blank"></div>';
  for (let d = 1; d <= dim; d++) {
    const c = { y:sel.y, m:sel.m, d }, dateISO = civKey(c);
    const di = V2.dayIndex(STATE.lake, dateISO), a = V2.astro(STATE.lake, dateISO);
    const has = !!di;
    cells += `<button type="button" class="cell ${civEq(c,today)?'today':''} ${civEq(c,sel)?'sel':''} ${has?'':'nohorizon'}"
      style="--sc:${has?heatLevel(di.indice):0}" data-day="${d}" aria-label="${esc(fmtLongDate(c))}${has?' — '+di.indice:''}">
      <span class="glow"></span><span class="mn">${moonPhaseSVG(a.phase)}</span>
      <span class="dnum">${d}</span>
      ${has ? `<span class="cell-idx">${di.indice}</span><span class="cell-win">${fmtTime(di.debut)}</span>`
            : `<span class="cell-idx na">—</span>`}</button>`;
  }
  return `<div class="cal-legend"><span><b>${esc(capFirst(fmtMonth(sel)))}</b></span>
      <span style="margin-left:auto">${t.v2.index} 0–100 · <span style="color:var(--dim)">•</span> ${t.v2.noData}</span></div>
    <div class="dow">${dowLabels().map(d=>`<span>${esc(d)}</span>`).join('')}</div>
    <div class="cal" data-role="cal">${cells}</div>`;
}

function weekHTML(){
  const t = T(), sel = STATE.sel;
  const ws = civAdd(sel, -civDow(sel));
  let rows = '';
  for (let i = 0; i < 7; i++) {
    const c = civAdd(ws, i), dateISO = civKey(c);
    const di = V2.dayIndex(STATE.lake, dateISO);
    rows += `<button type="button" class="wk-row ${civEq(c,sel)?'sel':''}" data-key="${dateISO}">
      <span class="wk-day"><b>${esc(fmtWeekday(c,'short').replace('.',''))}</b><span>${esc(fmtShortDate(c))}</span></span>
      <span class="wk-idx" style="--sc:${di?heatLevel(di.indice):0}">${di?di.indice:'—'}</span>
      <span class="wkt">${curveHTML(dateISO, true)}</span></button>`;
  }
  return `<div class="cal-legend"><span><b>${t.weekOf} ${esc(fmtShortDate(ws))}</b></span></div><div class="wk">${rows}</div>`;
}

function headHTML(){
  const t = T();
  return `<div class="app-head">
    <div class="app-title">
      <a class="back-lmt" href="/" title="${t.backTitle}">${ICON.chevL}<span>${t.back}</span></a>
      <span class="ic">${ICON.fish}</span>
      <div>${t.title}<small>${t.subFish}</small></div>
    </div>
    <div class="head-tools">
      <div class="seg lake-sel" data-role="lake">
        ${Object.keys(LAKES).map(k => `<button data-lake="${k}" class="${STATE.lake===k?'on':''}">${esc(t.v2.lakes[k] || LAKES[k].nom)}</button>`).join('')}
      </div>
      <button type="button" class="icon-btn" data-role="lang" title="FR / EN">${lang === 'fr' ? 'EN' : 'FR'}</button>
    </div>
  </div>`;
}

function render(){
  const t = T();
  document.body.dataset.mode = 'fish';
  document.documentElement.style.setProperty('--accent', 'var(--fish)');
  document.documentElement.lang = lang;

  let body;
  if (!lakeReady()) body = `<p style="color:var(--muted);padding:2rem 0;text-align:center">${t.loading}</p>`;
  else if (STATE.gran === 'month') body = bannerHTML() + monthHTML();
  else if (STATE.gran === 'week')  body = weekHTML();
  else body = '';

  const detail = lakeReady() ? detailHTML(STATE.sel) : '';
  document.getElementById('app').innerHTML =
    headHTML() +
    `<div style="display:flex;justify-content:center;margin-bottom:1rem" class="seg-scroll">
      <div class="seg" data-role="gran">
        <button data-g="day"   class="${STATE.gran==='day'?'on':''}">${t.day}</button>
        <button data-g="week"  class="${STATE.gran==='week'?'on':''}">${t.week}</button>
        <button data-g="month" class="${STATE.gran==='month'?'on':''}">${t.month}</button>
      </div></div>` +
    body + detail;
  document.getElementById('foot').textContent = t.footNote;
  document.title = t.title + ' — ' + (t.v2.lakes[STATE.lake] || LAKES[STATE.lake].nom);
}

/* ══════════════════════════════════════════════════════════════════════════
   10. Interactions (§4)
   ══════════════════════════════════════════════════════════════════════════ */
document.getElementById('app').addEventListener('click', e => {
  const lakeBtn = e.target.closest('[data-role=lake] button');
  if (lakeBtn) { switchLake(lakeBtn.dataset.lake); return; }

  const gran = e.target.closest('[data-role=gran] button');
  if (gran) { STATE.gran = gran.dataset.g; render(); return; }   // la position est conservée

  const lg = e.target.closest('[data-role=lang]');
  if (lg) { lang = lang === 'fr' ? 'en' : 'fr'; LS.rawSet('lm_lang', lang); render(); return; }

  const step = e.target.closest('.day-step button[data-step]');
  if (step) {
    STATE.sel = step.dataset.step === 'today' ? civToday() : civAdd(STATE.sel, Number(step.dataset.step));
    render(); return;                                            // la grille Mois suit (§11)
  }

  const cell = e.target.closest('[data-role=cal] .cell[data-day]');
  if (cell) { STATE.sel = { y:STATE.sel.y, m:STATE.sel.m, d:Number(cell.dataset.day) }; STATE.gran = 'day'; render(); return; }

  // Vue Semaine et bandeau « Prochaines fenêtres » : saut vers le jour visé.
  const key = e.target.closest('.wk-row[data-key], .bw-row[data-key]');
  if (key) { STATE.sel = civFromKey(key.dataset.key); STATE.gran = 'day'; render(); return; }
});

document.addEventListener('keydown', e => {
  if (STATE.gran !== 'day') return;
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    STATE.sel = civAdd(STATE.sel, e.key === 'ArrowRight' ? 1 : -1);
    render(); e.preventDefault();
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   10b. MOTEUR v2 — fondation (spec §15 et §16)
   ─────────────────────────────────────────────────────────────────────────
   Ajout PUREMENT ADDITIF : rien de ce qui précède n'est modifié, la page se
   comporte exactement comme avant. Ce bloc apporte le registre des lacs,
   la config `MODEL`, la couche horaire Open-Meteo et le classificateur de
   régime — tout ce sur quoi la Phase 1 doit être bâtie.

   Testable en console sans interface :
     await V2.load('manitou'); V2.strip('manitou', '2026-07-19')
   ══════════════════════════════════════════════════════════════════════════ */

/** Registre des lacs (§16.1). `dir` = table de direction propre au lac (§16.4). */
const LAKES = {
  manitou:  { nom:'Lac Manitou',  lat:46.0471, lon:-74.3739, capteur:true,
              dir:{ N:-15, NE:-10, E:0, SE:3, S:5, SO:10, O:5, NO:-10 } },
  // Devenyns démarre neutre : la table de Manitou encode sa géométrie de rives,
  // elle ne s'y transpose pas. Le journal la reconstruira (§16.4).
  devenyns: { nom:'Lac Devenyns', lat:47.0496, lon:-73.8241, capteur:false,
              dir:{ N:0, NE:0, E:0, SE:0, S:0, SO:0, O:0, NO:0 } }
};

/**
 * Configuration v2 (§15.10). Destinée à remplacer `SCORING`, cohabite le temps
 * de la transition. Hydratable depuis `localStorage` sous `lm_cp_model`.
 * ⚠️ Valeurs de départ, PAS un étalonnage — voir §20.1, §20.2 et §20.3.
 */
const MODEL = {
  base: 50,
  echelle: 1,                             // réétalonnage global (§20.3) ; 1 = brut
  horizonJours: 10,                       // horizon réel de gem_seamless (§16.2)
  regimes: {                              // §15.3
    X: { nom:'passage du front',   score:  2 },
    F: { nom:'postfrontal froid',  score:-25 },
    A: { nom:'front en approche',  score: 25 },
    P: { nom:'préfrontal',         score: 22 },
    R: { nom:'retour à la stabilité', score: 5 },
    S: { nom:'stable',             score:  8 },
    '?':{ nom:'indéterminé',       score:  0 }
  },
  press: {                                // §15.4
    chuteRapide:15, baisseLente:20, stable:7, hausseLente:-3, hausseRapide:-15,
    hautePression:-3, seuilHaute:1025
  },
  vent: [                                 // §15.5 — [max km/h, score]
    [4,-3], [9,5], [18,13], [28,8], [39,0], [Infinity,-15]
  ],
  // §15.5 « Vent du nord » (§3.3 du PDF) : REMPLACE la ligne N de la table de
  // direction du lac, ne s'y ajoute pas. `nordPostfrontal` s'applique quand le
  // régime F est actif, `nordIsole` sinon.
  //
  // Décision §20.2 (2026-07-22, Ben) :
  //   • `neutraliserPreferences:true` → les 7 secteurs de préférence
  //     (NE·E·SE·S·SO·O·NO) valent 0 pour tous les lacs. La table « dicton » de
  //     Manitou dort dans LAKES.manitou.dir, réactivable en passant ce flag à
  //     false une fois validée par le journal.
  //   • `nordIsole:0` → le nord ISOLÉ ne pénalise plus. L'expérience « nord =
  //     mauvais » de Manitou est confondue par le capteur, qui lit tout le
  //     quadrant ouest comme N/NO (§18.5) : impossible de savoir si c'est le
  //     nord ou l'ouest qui déçoit. Le journal tranchera. (Valeur d'origine −7.)
  //   • `nordPostfrontal:-20` → CONSERVÉ. Règle météo générale (front froid NO),
  //     indépendante du capteur, confirmée à Devenyns le 19 juillet ; couplée au
  //     régime F et ramenée à −10 par l'anti-double-comptage (§15.8).
  dir: { nordIsole:0, nordPostfrontal:-20, neutraliserPreferences:true },
  lune: { nouvelle:4, pleineNuit:4, pleineJour:0, quartier:1,
          leverCoucher:4, transit:2, plafond:10,         // §15.6
          fenetrePhaseJours:1.5, fenetreEvtMin:90 },     // largeurs des fenêtres
  heure: { aube:9, matin:5, midi:-3, finJournee:6, crepuscule:9, nuit:0 },  // §15.7
  correlation: { reduite:0.5, pleine:1.0 },              // §15.8
  jour: { fenetreH:2 },                                  // §15.9 — meilleure fenêtre
  meilleures: { seuil:60, maxParJour:2, top:6 },         // §15.9b — classement transversal
  // §15.3 — seuils du classificateur postfrontal, validés le 2026-07-22
  postfrontal: { fenetreCreux:18, hausseMin:2.0, d3Min:0.3 },
  hysteresis:  { dureeMin:3 }                            // §15.3b
};

// Hydratation de MODEL depuis localStorage (§15.10). Pour l'instant seul le
// facteur de réétalonnage `echelle` est persisté (§20.3) — la Phase 2 (panneau
// de réglages) étendra ce merge aux autres seuils édités par Ben.
const MODEL_KEY = 'lm_cp_model';
function loadModelCfg(){
  const s = LS.get(MODEL_KEY, null);
  if (s && typeof s === 'object' && typeof s.echelle === 'number' && s.echelle > 0) MODEL.echelle = s.echelle;
}
function saveModelCfg(){ LS.set(MODEL_KEY, { echelle: MODEL.echelle }); }
loadModelCfg();

const SECTEURS = ['N','NE','E','SE','S','SO','O','NO'];
const secteurDe = deg => SECTEURS[Math.round((((deg % 360) + 360) % 360) / 45) % 8];

/* ── Couche horaire Open-Meteo, par lac (§15.2, §16.2) ── */
const V2 = {
  series: {},

  /** Charge la série horaire brute d'un lac. Cache mémoire + localStorage 1 h. */
  async load(lakeKey, passe = 14) {
    const L = LAKES[lakeKey];
    if (!L) throw new Error('lac inconnu : ' + lakeKey);
    const ck = 'lm_cp_hourly_' + lakeKey;
    const cache = LS.get(ck, null);
    if (cache && Date.now() - cache.ts < 3600e3) { V2.series[lakeKey] = cache.h; return cache.h; }
    const url = OPEN_METEO + '?latitude=' + L.lat + '&longitude=' + L.lon +
      '&models=gem_seamless' +
      '&hourly=pressure_msl,temperature_2m,wind_speed_10m,wind_gusts_10m,' +
      'wind_direction_10m,cloud_cover,precipitation' +
      '&timezone=' + encodeURIComponent(TZ) +
      '&past_days=' + passe + '&forecast_days=' + (MODEL.horizonJours + 1);
    const r = await fetch(url);
    const j = await r.json();
    if (!j || !j.hourly || !j.hourly.time) throw new Error('réponse Open-Meteo vide');
    V2.series[lakeKey] = j.hourly;
    if (V2._reg)  V2._reg[lakeKey]  = null;               // invalide le cache de régimes
    if (V2._days) V2._days[lakeKey] = null;               // et l'index jour → heures
    LS.set(ck, { ts: Date.now(), h: j.hourly });
    return j.hourly;
  },

  /** Index { dateISO → [indices horaires] } d'un lac, construit et caché à la volée. */
  dayHours(lakeKey, dateISO) {
    const h = this.series[lakeKey];
    this._days = this._days || {};
    let map = this._days[lakeKey];
    if (!map) {
      map = this._days[lakeKey] = {};
      for (let i = 0; i < h.time.length; i++) {
        const dk = h.time[i].slice(0, 10);
        (map[dk] = map[dk] || []).push(i);
      }
    }
    return map[dateISO] || [];
  },

  /**
   * Régime brut à l'indice horaire `i` (§15.3). Cascade à priorité décroissante,
   * la première règle vraie l'emporte.
   *
   * ⚠️ Le postfrontal ne s'appuie PAS sur la température : le réchauffement
   * diurne masque le refroidissement postfrontal, et `dT24` ne règle rien non
   * plus (l'ensoleillement change d'un jour à l'autre). La règle est
   * structurelle — être sur la branche montante après un creux de pression.
   * Validée le 2026-07-22 : 16 h sur 17 le 19 juillet, 24 % du temps sur 14 j.
   */
  regimeAt(h, i) {
    const P = h.pressure_msl[i];
    if (P == null || i < 24) return '?';
    const d = n => P - h.pressure_msl[i - n];
    const d3 = d(3), d6 = d(6), d12 = d(12);
    const D = h.wind_direction_10m[i], D3 = h.wind_direction_10m[i - 3];
    const virage = (D == null || D3 == null) ? null : Math.abs((D - D3 + 180) % 360 - 180);
    const W = h.wind_speed_10m[i], W6 = h.wind_speed_10m[i - 6];
    const N = h.cloud_cover[i], N6 = h.cloud_cover[i - 6];
    const dN = (N == null || N6 == null) ? null : N - N6;
    const G = h.wind_gusts_10m[i];
    let R3 = 0; for (let k = Math.max(0, i - 2); k <= i; k++) R3 += h.precipitation[k] || 0;

    const pf = MODEL.postfrontal;
    const creux = Math.min.apply(null, h.pressure_msl.slice(i - pf.fenetreCreux, i + 1));
    const nordique = D != null && (D >= 292.5 || D <= 67.5);

    if (virage != null && virage >= 60 && (R3 > 0.5 || (G || 0) >= 25) && d3 > -0.5 && d6 < -1) return 'X';
    if (P - creux >= pf.hausseMin && d3 >= pf.d3Min && nordique) return 'F';
    if (d3 <= -1.5 && W6 != null && W > W6 && (N >= 70 || R3 > 0)) return 'A';
    if (d6 >= -3.5 && d6 <= -0.8 && dN != null && dN >= 10) return 'P';
    if (Math.abs(d3) < 1 && Math.abs(d12) < 2) return 'S';
    return 'R';
  },

  /**
   * Régimes de toute la série, avec persistance (§15.3b). Un régime est un état
   * physique : il ne doit pas clignoter parce qu'une valeur frôle un seuil.
   * Comble les trous d'une heure, puis absorbe les segments trop courts.
   */
  classify(lakeKey, h) {
    h = h || V2.series[lakeKey];                          // série explicite pour le rejeu (§17.1)
    if (!h) throw new Error('série non chargée — appeler V2.load() d\'abord');
    const brut = h.time.map((_, i) => V2.regimeAt(h, i));
    for (let i = 1; i < brut.length - 1; i++)            // trous d'une heure
      if (brut[i - 1] === brut[i + 1] && brut[i] !== brut[i - 1]) brut[i] = brut[i - 1];
    let s = 0;                                           // segments trop courts
    for (let i = 1; i <= brut.length; i++) {
      if (i === brut.length || brut[i] !== brut[s]) {
        if (i - s < MODEL.hysteresis.dureeMin && s > 0)
          for (let k = s; k < i; k++) brut[k] = brut[s - 1];
        s = i;
      }
    }
    return brut;
  },

  /** Bande de 24 caractères pour une date — outil de relecture humaine (Phase 0). */
  strip(lakeKey, dateISO) {
    const h = V2.series[lakeKey], reg = V2.classify(lakeKey);
    let out = '', ctx = [];
    for (let i = 0; i < h.time.length; i++) {
      if (!h.time[i].startsWith(dateISO)) continue;
      out += reg[i];
      ctx.push(h.time[i].slice(11, 16) + ' ' + reg[i] + ' ' +
               Math.round(h.pressure_msl[i]) + 'hPa ' +
               Math.round(h.wind_speed_10m[i]) + 'km/h ' + secteurDe(h.wind_direction_10m[i]));
    }
    return { date: dateISO, bande: out, detail: ctx };
  },

  /* ── Helpers temps & astronomie, par lac (§15.6, §15.7, §16.1) ────────────
     La couche v1 (`solunar`) est câblée sur `LAKE` (Manitou) et raisonne par
     jour civil. Le moteur v2 raisonne par HEURE et doit prendre les
     coordonnées du lac sélectionné — 1° de latitude décale le lever de soleil
     de plusieurs minutes (§16.1). On duplique donc ici une astronomie
     lac-consciente plutôt que de toucher au bloc v1 éprouvé. */

  /** Instant UTC (ms) de « HH:MM local Toronto » un jour donné. Double passe = DST-safe. */
  localMs(dateISO, hh, mm) {
    const c = civFromKey(dateISO);
    const naive = Date.UTC(c.y, c.m - 1, c.d, hh, mm);
    let ts = naive - tzOffsetMs(naive);
    return naive - tzOffsetMs(ts);
  },

  /** Instant UTC (ms) de l'heure horaire `i` (Open-Meteo renvoie l'heure locale). */
  tsAt(h, i) {
    const s = h.time[i];                                 // "YYYY-MM-DDTHH:MM"
    return this.localMs(s.slice(0, 10), +s.slice(11, 13), +s.slice(14, 16));
  },

  /**
   * Événements solaires et lunaires d'un jour civil aux coordonnées du lac.
   * Lever/coucher/transits de lune obtenus en balayant l'altitude sur les
   * bornes réelles du jour (23/24/25 h) — même méthode que `solunar`, robuste
   * au fuseau. Cache par lac+date.
   */
  astro(lakeKey, dateISO) {
    const key = lakeKey + '|' + dateISO;
    this._astro = this._astro || {};
    if (this._astro[key]) return this._astro[key];
    const L = LAKES[lakeKey], c = civFromKey(dateISO);
    const { start, end } = civSpan(c);
    const noon = start + (end - start) / 2;
    const STEP = 10 * 60000;
    let maxA = -Infinity, minA = Infinity, tUp = noon, tDown = noon;
    let prevA = null, prevT = null, rise = null, set = null;
    for (let t = start; t <= end; t += STEP) {
      const a = SunCalc.getMoonPosition(new Date(t), L.lat, L.lon).altitude;
      if (a > maxA) { maxA = a; tUp = t; }
      if (a < minA) { minA = a; tDown = t; }
      if (prevA !== null && (prevA < 0) !== (a < 0)) {
        const f = -prevA / (a - prevA), z = prevT + f * (t - prevT);
        if (a > 0 && rise == null) rise = z;
        if (a < 0 && set == null) set = z;
      }
      prevT = t; prevA = a;
    }
    const sun = SunCalc.getTimes(new Date(noon), L.lat, L.lon);
    const ill = SunCalc.getMoonIllumination(new Date(noon));
    const out = {
      sunrise: sun.sunrise && !isNaN(sun.sunrise) ? +sun.sunrise : null,
      sunset:  sun.sunset  && !isNaN(sun.sunset)  ? +sun.sunset  : null,
      moonrise: rise, moonset: set, transitUp: tUp, transitDown: tDown,
      phase: ill.phase, fraction: ill.fraction
    };
    this._astro[key] = out;
    return out;
  },

  /**
   * Règle anti-double-comptage (§15.8) — l'apport central du modèle. Quand
   * plusieurs facteurs découlent du même front, on garde tout le score de
   * régime et on réduit de moitié ceux qui ne font que le refléter (pression et
   * direction). La VITESSE du vent garde son plein effet : elle agit sur la
   * pêchabilité concrète, pas sur le régime.
   */
  reduction(regime) {
    return ('XFAP'.includes(regime)) ? MODEL.correlation.reduite : MODEL.correlation.pleine;
  },

  /* ── Les cinq facteurs de score (§15.4 à §15.7) ───────────────────────────
     Chacun rend son score BRUT (avant réduction anti-double-comptage §15.8).
     Barèmes dans `MODEL`. */

  /**
   * Pression — §15.4. Le PDF combine plusieurs fenêtres : la courte détecte les
   * extrêmes, les longues portent les tendances graduelles. On en tire un taux
   * DOMINANT (hPa/h, la fenêtre 3/6/12 h de plus forte amplitude) puis on
   * interpole linéairement entre les bornes des états — une chute de 3,8 hPa/6 h
   * ne vaut pas exactement une chute de 5,2 (§15.4). La baisse LENTE reste le
   * meilleur score (+20 > +15 de la chute rapide) : une descente régulière bat
   * un effondrement.
   */
  scorePress(h, i) {
    const P = h.pressure_msl[i];
    if (P == null) return 0;
    const p = MODEL.press;
    const d = n => (i >= n && h.pressure_msl[i - n] != null) ? P - h.pressure_msl[i - n] : null;
    const taux = [d(3), d(6), d(12)].map((v, k) => v == null ? null : v / [3, 6, 12][k]);
    let r = 0;
    for (const x of taux) if (x != null && Math.abs(x) > Math.abs(r)) r = x;
    // Points (taux hPa/h → score), en taux croissant. Bornes dérivées des seuils
    // du §15.4 : dP3≤−3 ≈ −1,0 hPa/h et dP6≤−5 ≈ −0,83 → chute rapide ; baisse
    // lente −3..−1/6 h ≈ −0,5..−0,17 ; hausse lente +1..+3/6 h ≈ +0,17..+0,5.
    const pts = [
      [-0.90, p.chuteRapide], [-0.50, p.baisseLente], [-0.17, p.baisseLente],
      [ 0.00, p.stable], [ 0.17, p.hausseLente], [ 0.50, p.hausseLente],
      [ 0.85, p.hausseRapide]
    ];
    let s;
    if (r <= pts[0][0]) s = pts[0][1];
    else if (r >= pts[pts.length - 1][0]) s = pts[pts.length - 1][1];
    else { s = p.stable;
      for (let k = 1; k < pts.length; k++) if (r <= pts[k][0]) {
        const a = pts[k - 1], b = pts[k];
        s = a[1] + (b[1] - a[1]) * (r - a[0]) / (b[0] - a[0]); break;
      }
    }
    if (P > p.seuilHaute) s += p.hautePression;           // pression absolue haute (§15.4)
    return s;
  },

  /** Vent — vitesse (§15.5). Table [maxKmh, score] de `MODEL.vent`, appliquée à
   *  l'échelle Open-Meteo « terrain dégagé » (§20.1 : recommandation retenue). */
  scoreVentVitesse(h, i) {
    const W = h.wind_speed_10m[i];
    if (W == null) return 0;
    for (const [maxK, sc] of MODEL.vent) if (W <= maxK) return sc;
    return 0;
  },

  /**
   * Vent — direction (§15.5, §16.4). Le secteur N passe par la règle « vent du
   * nord » (§3.3, qui REMPLACE la ligne N) ; les autres secteurs viennent de la
   * table du lac, neutralisée par défaut (§20.2). `regime` sert à distinguer un
   * nord postfrontal (−20) d'un nord isolé (−7).
   */
  scoreDirection(lakeKey, h, i, regime) {
    const D = h.wind_direction_10m[i];
    if (D == null) return 0;
    const sect = secteurDe(D);
    if (sect === 'N') return regime === 'F' ? MODEL.dir.nordPostfrontal : MODEL.dir.nordIsole;
    if (MODEL.dir.neutraliserPreferences) return 0;
    return LAKES[lakeKey].dir[sect] ?? 0;
  },

  /**
   * Bande horaire de la journée (§15.7) aux coordonnées du lac. Ordre exclusif,
   * bornes clampées pour garantir une couverture continue de l'aube au
   * crépuscule sans trou, même l'hiver (lever tardif).
   */
  heureBucket(lakeKey, h, i) {
    const ts = this.tsAt(h, i), dateISO = h.time[i].slice(0, 10);
    const a = this.astro(lakeKey, dateISO);
    if (a.sunrise == null || a.sunset == null) return 'nuit';
    const MIN = 60000, sr = a.sunrise, ss = a.sunset;
    const t1030 = this.localMs(dateISO, 10, 30);
    const aubeFin  = sr + 90 * MIN;
    const matinFin = Math.max(t1030, aubeFin);
    const crep0 = ss - 45 * MIN, crep1 = ss + 45 * MIN;
    const fin0  = Math.min(ss - 120 * MIN, crep0);
    if (ts < sr - 60 * MIN) return 'nuit';
    if (ts <= aubeFin)  return 'aube';
    if (ts <= matinFin) return 'matin';
    if (ts < fin0)      return 'midi';
    if (ts < crep0)     return 'finJournee';
    if (ts <= crep1)    return 'crepuscule';
    return 'nuit';
  },

  /** Heure de la journée — §15.7. La pénalité de midi est annulée si le ciel est
   *  couvert (N ≥ 70 %) ET le vent modéré (W ≥ 10 km/h). */
  scoreHeure(lakeKey, h, i) {
    const b = this.heureBucket(lakeKey, h, i);
    let s = MODEL.heure[b] ?? 0;
    if (b === 'midi') {
      const N = h.cloud_cover[i], W = h.wind_speed_10m[i];
      if (N != null && N >= 70 && W != null && W >= 10) s = 0;
    }
    return s;
  },

  /**
   * Lune — §15.6, plafonnée à +10. Phase (nouvelle/pleine/quartier) + événements
   * (lever/coucher ±90 min, transit sup./inf. ±90 min). La pleine lune ne vaut
   * que la nuit, l'aube ou le crépuscule ; nulle en plein midi.
   */
  scoreLune(lakeKey, h, i) {
    const M = MODEL.lune, ts = this.tsAt(h, i), dateISO = h.time[i].slice(0, 10);
    const a = this.astro(lakeKey, dateISO);
    let s = 0;
    const wPhase = M.fenetrePhaseJours / 29.53;
    const dNew = Math.min(a.phase, 1 - a.phase), dFull = Math.abs(a.phase - 0.5);
    if (dNew < wPhase) s += M.nouvelle;
    else if (dFull < wPhase) {
      const b = this.heureBucket(lakeKey, h, i);
      s += b === 'midi' ? M.pleineJour : M.pleineNuit;
    } else if (Math.abs(a.phase - 0.25) < wPhase || Math.abs(a.phase - 0.75) < wPhase) {
      s += M.quartier;
    }
    const win = M.fenetreEvtMin * 60000;
    if ((a.moonrise != null && Math.abs(ts - a.moonrise) <= win) ||
        (a.moonset  != null && Math.abs(ts - a.moonset)  <= win)) s += M.leverCoucher;
    if (Math.abs(ts - a.transitUp) <= win || Math.abs(ts - a.transitDown) <= win) s += M.transit;
    return Math.min(s, M.plafond);
  },

  /* ── Assemblage de l'indice (§15.1) ───────────────────────────────────────*/

  /** Régimes du lac, avec cache (classify est O(n)). Invalidé par load(). */
  regimes(lakeKey) {
    this._reg = this._reg || {};
    if (!this._reg[lakeKey]) this._reg[lakeKey] = this.classify(lakeKey);
    return this._reg[lakeKey];
  },

  /**
   * Décomposition de l'indice horaire (§15.1) — sert au calcul comme à la vue
   * Jour (facteur par facteur, régime en tête, réduction explicite). `brut` est
   * l'indice avant réétalonnage (§20.3) ; `value` est l'indice affiché 0-100.
   */
  decompose(lakeKey, i, h, reg) {
    h = h || this.series[lakeKey];                        // série + régime explicites pour le rejeu
    if (reg == null) reg = this.regimes(lakeKey)[i];
    const red = this.reduction(reg);
    const pr = this.scorePress(h, i);
    const di = this.scoreDirection(lakeKey, h, i, reg);
    const parts = {
      regime:    MODEL.regimes[reg] ? MODEL.regimes[reg].score : 0,
      pression:  pr * red,
      direction: di * red,
      vitesse:   this.scoreVentVitesse(h, i),
      lune:      this.scoreLune(lakeKey, h, i),
      heure:     this.scoreHeure(lakeKey, h, i)
    };
    let brut = MODEL.base;
    for (const k in parts) brut += parts[k];
    const value = Math.max(0, Math.min(100,
      Math.round(MODEL.base + (brut - MODEL.base) * MODEL.echelle)));
    return { i, t: h.time[i], regime: reg, red, parts, brutFacteurs: { pression: pr, direction: di }, brut, value };
  },

  /** Indice horaire 0-100 pour l'heure `i` (§15.1). */
  indexAt(lakeKey, i) {
    return this.decompose(lakeKey, i).value;
  },

  /* ── Agrégation journalière (§15.9) ───────────────────────────────────────*/

  /**
   * Meilleure fenêtre de `fenetreH` heures d'un jour civil (§15.9) : non pas la
   * moyenne du jour mais le maximum, sur les heures de départ du jour, de la
   * moyenne de l'indice sur la fenêtre. Répond à « quand y aller », pas
   * seulement « quel jour ». La fenêtre peut déborder après minuit.
   */
  dayIndex(lakeKey, dateISO) {
    const h = this.series[lakeKey], span = MODEL.jour.fenetreH;
    let best = null;
    for (const i of this.dayHours(lakeKey, dateISO)) {
      let sum = 0, k = 0;
      for (let j = i; j < i + span && j < h.time.length; j++) { sum += this.indexAt(lakeKey, j); k++; }
      const moy = sum / k;
      if (!best || moy > best.moy) best = { moy, i, debut: this.tsAt(h, i), fin: this.tsAt(h, i) + span * 3600e3 };
    }
    if (!best) return null;
    return { date: dateISO, indice: Math.round(best.moy), debut: best.debut, fin: best.fin, i: best.i };
  },

  /** Fiabilité d'une fenêtre selon l'échéance en jours (§15.9b). */
  fiabilite(echeanceJours) {
    if (echeanceJours <= 2)  return 'bonne';
    if (echeanceJours <= 5)  return 'correcte';
    if (echeanceJours <= 10) return 'indicative';
    return 'lune';
  },

  /**
   * Meilleures fenêtres à venir, classées entre elles sur tout l'horizon
   * (§15.9b) — répond à « quand y aller dans les dix prochains jours ». Lisse
   * par moyenne glissante de 2 h, retient les maxima locaux au-dessus du seuil,
   * plafonne à `maxParJour` par jour pour couvrir l'horizon plutôt que de
   * s'agglutiner sur la meilleure journée, puis garde les `top` premiers.
   * Chaque fenêtre porte son régime, son facteur dominant et sa fiabilité.
   */
  meilleuresFenetres(lakeKey) {
    const h = this.series[lakeKey], n = h.time.length, cfg = MODEL.meilleures;
    const span = MODEL.jour.fenetreH;
    const idx = new Array(n);
    for (let i = 0; i < n; i++) idx[i] = this.indexAt(lakeKey, i);
    const sm = new Array(n);                              // moyenne glissante 2 h
    for (let i = 0; i < n; i++) {
      let sum = 0, k = 0;
      for (let j = i; j < i + span && j < n; j++) { sum += idx[j]; k++; }
      sm[i] = sum / k;
    }
    const now = Date.now();
    let i0 = 0; while (i0 < n && this.tsAt(h, i0) < now) i0++;
    const cands = [];
    for (let i = Math.max(1, i0); i < n - 1; i++) {
      // Strict à gauche : sur un plateau de valeurs égales, seul le premier point
      // (celui qui monte dans le plateau) est retenu — évite deux fenêtres
      // adjacentes qui se chevauchent (§15.9b : couvrir l'horizon, pas s'agglutiner).
      if (sm[i] >= cfg.seuil && sm[i] > sm[i - 1] && sm[i] >= sm[i + 1]) {
        const dec = this.decompose(lakeKey, i);
        let fk = null, fv = -Infinity;                   // facteur dominant (plus fort apport positif)
        for (const key in dec.parts) if (dec.parts[key] > fv) { fv = dec.parts[key]; fk = key; }
        const debut = this.tsAt(h, i);
        cands.push({
          i, indice: Math.round(sm[i]), debut, fin: debut + span * 3600e3,
          jour: h.time[i].slice(0, 10), regime: dec.regime, facteur: fk,
          echeanceJours: (debut - now) / DAY_MS,
          fiabilite: this.fiabilite((debut - now) / DAY_MS)
        });
      }
    }
    const parJour = {};                                  // plafonner maxParJour / jour
    for (const c of cands) (parJour[c.jour] = parJour[c.jour] || []).push(c);
    let retenus = [];
    for (const j in parJour)
      retenus = retenus.concat(parJour[j].sort((a, b) => b.indice - a.indice).slice(0, cfg.maxParJour));
    return retenus.sort((a, b) => b.indice - a.indice).slice(0, cfg.top);
  },

  /* ── Réétalonnage (§20.3) ─────────────────────────────────────────────────*/

  /**
   * Cale l'échelle globale pour que le 99ᵉ centile de l'indice BRUT sur
   * l'historique tombe vers 92 (§20.3) : le 100 reste aux journées vraiment
   * rares, la discrimination entre 65 et 90 — la zone qui décide des sorties —
   * est préservée. Ne considère que le passé (`ts < now`), pas la prévision.
   * Met à jour `MODEL.echelle` et le persiste. Peut recevoir plusieurs lacs
   * pour mutualiser l'échantillon.
   */
  recalibrer(lakeKeys, cible = 92) {
    const keys = Array.isArray(lakeKeys) ? lakeKeys : [lakeKeys];
    const now = Date.now(), raw = [];
    for (const lac of keys) {
      const h = this.series[lac];
      if (!h) continue;
      for (let i = 0; i < h.time.length; i++)
        if (this.tsAt(h, i) < now) raw.push(this.decompose(lac, i).brut);
    }
    if (raw.length < 20) return { n: raw.length, erreur: 'historique trop court' };
    raw.sort((a, b) => a - b);
    const p99 = raw[Math.floor(raw.length * 0.99)];
    if (p99 <= MODEL.base) return { n: raw.length, p99, erreur: 'p99 sous la base' };
    MODEL.echelle = (cible - MODEL.base) / (p99 - MODEL.base);
    saveModelCfg();
    return { n: raw.length, p99: Math.round(p99 * 10) / 10, echelle: Math.round(MODEL.echelle * 1000) / 1000, cible };
  },

  /** Réétalonne une seule fois (au premier usage), sauf si déjà persisté. */
  ensureCalibrated(lakeKeys) {
    if (LS.get(MODEL_KEY, null)) return null;             // déjà calé sur cet appareil
    return this.recalibrer(lakeKeys);
  },

  /* ── Rejeu du modèle sur une sortie du journal (§17.1, §17.4) ─────────────
     Principe fondateur : le journal stocke les ENTRÉES météo, jamais le score.
     N'importe quelle version du modèle peut donc être rejouée sur toutes les
     sorties passées → calibration cumulative. */

  /** Série de type Open-Meteo reconstruite depuis les `conditions_horaires`
   *  d'une entrée de journal (§17.2). Accepte l'ancien `R3` faute de `R`. */
  serieDepuisEntree(entry) {
    const c = entry.conditions_horaires || entry.conditions || [];
    const col = (f, d) => c.map(x => x[f] != null ? x[f] : d);
    return {
      time: c.map(x => x.t),
      pressure_msl:       col('P', null),
      temperature_2m:     col('T', null),
      wind_speed_10m:     col('W', null),
      wind_gusts_10m:     col('G', null),
      wind_direction_10m: col('D', null),
      cloud_cover:        col('N', null),
      // `R` = précip horaire (préféré) ; à défaut on répartit `R3` sur 3 h.
      precipitation: c.map(x => x.R != null ? x.R : (x.R3 != null ? x.R3 / 3 : 0))
    };
  },

  /** Rejoue l'indice horaire du modèle courant sur une série explicite `h`
   *  (§17.1). Retourne un point par heure : { i, t, regime, value, brut, parts }. */
  rejouer(lakeKey, h) {
    const reg = this.classify(lakeKey, h);
    return h.time.map((t, i) => {
      const d = this.decompose(lakeKey, i, h, reg[i]);
      return { i, t, regime: d.regime, value: d.value, brut: d.brut, parts: d.parts };
    });
  },

  /**
   * Point de calibration d'une sortie (§17.4) : indice prédit (rejoué) sur la
   * fenêtre [debut, fin] en regard des captures/heure et touches/heure, tagué
   * par régime dominant. `parHeure` porte le rejeu complet pour les graphes.
   */
  calibrer(entry) {
    const lakeKey = entry.lac, h = this.serieDepuisEntree(entry);
    if (!h.time.length) return null;
    const rej = this.rejouer(lakeKey, h);
    const { debut, fin } = entry;
    const dans = (debut && fin)
      ? rej.filter(r => { const ts = this.tsAt(h, r.i); return ts >= debut && ts < fin; })
      : rej;
    const vals = dans.map(r => r.value);
    const moy = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;
    const heures = (debut && fin) ? (fin - debut) / 3600e3 : null;
    const reg = {};
    for (const r of dans) reg[r.regime] = (reg[r.regime] || 0) + 1;
    return {
      lac: lakeKey,
      indiceMoyen: moy(vals),
      indiceMax: vals.length ? Math.max.apply(null, vals) : null,
      heures,
      capturesParH: (entry.captures != null && heures) ? entry.captures / heures : null,
      touchesParH:  (entry.touches  != null && heures) ? entry.touches  / heures : null,
      regimeDominant: Object.keys(reg).sort((a, b) => reg[b] - reg[a])[0] || null,
      resultat_confiance: entry.resultat_confiance || null,
      parHeure: rej
    };
  }
};

window.LAKES = LAKES; window.MODEL = MODEL; window.V2 = V2;

/* ══════════════════════════════════════════════════════════════════════════
   11. Démarrage + bascule de lac + auto-refresh
   ══════════════════════════════════════════════════════════════════════════ */

/** Charge la série d'un lac (voile de chargement pendant l'attente réseau). */
async function ensureLake(lakeKey){
  if (V2.series[lakeKey]) return;
  try { await V2.load(lakeKey); V2.ensureCalibrated(Object.keys(LAKES).filter(k => V2.series[k])); }
  catch(e){ /* réseau indisponible → la vue reste sur le voile de chargement */ }
}

/** Change de lac : persiste, charge si besoin, rerend. */
async function switchLake(lakeKey){
  if (!LAKES[lakeKey] || lakeKey === STATE.lake) return;
  STATE.lake = lakeKey;
  LS.rawSet('lm_cp_lake', lakeKey);
  render();                                   // voile immédiat si la série n'est pas encore là
  await ensureLake(lakeKey);
  render();
}

if (!LAKES[STATE.lake]) STATE.lake = 'manitou';   // validation différée (cf. STATE)
render();                                     // voile de chargement
ensureLake(STATE.lake).then(render);

// Rafraîchissement horaire : le cache Open-Meteo a un TTL de 1 h (V2.load).
setInterval(() => {
  V2.series[STATE.lake] = null;               // force le rechargement au-delà du TTL
  ensureLake(STATE.lake).then(render);
}, 60 * 60 * 1000);
})();
</script>
